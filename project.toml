# Drafted on 2026-10-28 by _system 4b (not yet verified in plume's own session).
# Format: ~/Documents/_system/docs/project-toml.md

[project]
name = "plume"
group = "portfolio/spec"
kind = "app"                # FastAPI salon-suite booking app (README.md)
status = "active"           # PLAT-SEC-02 merged 2026-10-24 (plume#9)
repo = "EvanWAppel/plume"
visibility = "public"       # gh repo view
on_site = false             # not in enki data/projects.ts
verified = false

[deploy]
host = "railway"            # README.md "Deploy (Railway)"; Railpack via root main.py
services = []               # Railway service name not recorded in the repo (_system
                            # docs/credential-rotation-2026-10-24.md:447 lists it as unknown)
domain = "unknown"          # no hostname in README/DECISIONS/TASKS
origin_urls_closed = "unknown"

[auth]
scheme = "per-user"         # app's own email+password accounts, JWT bearer/session cookie,
                            # operator vs member roles (README.md; PLUME_SECRET_KEY)
access_list = "table:users (operator-created; first operator via seed or CLI)"   # README.md "The first operator"
target = "unknown"

[data]
db = "sqlite"               # SQLModel over SQLite, PLUME_DATABASE_URL defaults to sqlite:///plume.db;
                            # no Railway volume, so it resets each deploy (BLOCKED.md PLAT-SEC-02 item)

[demo]
status = "none"             # deploy seeds demo data (PLUME_SEED_ON_START) but sign-in needs the
                            # private PLUME_SEED_OPERATOR_PASSWORD; no public demo path
url = ""
path = ""

[keys]
paid = []                   # only PLUME_* settings are read (plume/); no paid provider SDKs
isolated = "n/a"
spend_cap = "n/a"

[platform]
done = ["PLAT-SEC-01", "PLAT-SEC-02"]   # TASKS.md:105-106 (E6/E7), both [x] on main
