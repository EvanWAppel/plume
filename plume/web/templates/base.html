<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#eee8dc" />
  <meta name="description" content="Plume is an independent salon collective with a strange little soul. Flexible stations, private studios, and room to create." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>{% block title %}plume — a space for your strange{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500&family=DM+Sans:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/htmx.org@2.0.8" defer></script>
  <style>{% include "styles.css" %}</style>
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header wrap">
    <a class="wordmark" href="/" aria-label="Plume home">plume<span aria-hidden="true">✳</span></a>
    <nav aria-label="Main navigation">
      <a href="/#spaces">The spaces</a>
      <a href="/#spirit">The spirit</a>
      {% if request.url.path.startswith('/dashboard') %}
      <a href="/logout">Log out</a>
      {% else %}
      <a href="/login" {% if request.url.path == '/login' %}aria-current="page"{% endif %}>Operator login</a>
      {% endif %}
    </nav>
    <a class="button button-small" href="/book" {% if request.url.path == '/book' %}aria-current="page"{% endif %}>Find your space <span aria-hidden="true">↗</span></a>
  </header>
  <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
  <footer class="site-footer wrap">
    <a class="wordmark" href="/" aria-label="Plume home">plume<span aria-hidden="true">✳</span></a>
    <p>Independent spirits. Shared space.</p>
    <a href="/dashboard">Operator dashboard <span aria-hidden="true">↗</span></a>
    <span class="footer-note">A little out of the ordinary.</span>
  </footer>
</body>
</html>
