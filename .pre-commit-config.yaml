# prek / pre-commit hooks (X1). Run: `prek install` then `prek run --all-files`.
# Local, system-language hooks so versions track the uv-managed dev deps.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false
      - id: ty
        name: ty (typecheck)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
